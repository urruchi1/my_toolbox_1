[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "my-toolbox"
version = "0.1.0"
description = "Custom visualization utilities"
authors = [
  {name = "Pablo Urruchi"}
]
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
  "pandas",
  "numpy",
  "matplotlib",
  "seaborn"
]

[tool.setuptools.packages.find]
where = ["."]